services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-claimflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claimflow} # local-dev default only; override in .env
      POSTGRES_DB: ${POSTGRES_DB:-claimflow}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-claimflow} -d ${POSTGRES_DB:-claimflow}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Optional .env supplies LLM_PROVIDER, LLM_MODEL, ANTHROPIC_API_KEY, ... (see .env.example).
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-claimflow}:${POSTGRES_PASSWORD:-claimflow}@db:5432/${POSTGRES_DB:-claimflow}
      CHROMA_DIR: /srv/chroma_db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Generated benchmark files and evaluation reports appear on the host.
      - ./data:/srv/data
      - ./evaluation_results:/srv/evaluation_results
      - chroma_data:/srv/chroma_db

volumes:
  postgres_data:
  chroma_data:
